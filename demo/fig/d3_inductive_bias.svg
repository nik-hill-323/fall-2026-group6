<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1180" height="560" fill="#ffffff"/>
  <text x="590" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Diagnostic 3: Inductive-bias probe</text>
  <text x="590" y="50" text-anchor="middle" font-size="12" fill="#666">Does the pretrained model carry the world model? Give it a new job with almost no data and see what it brings.</text>

  <!-- Row labels -->
  <text x="20" y="150" font-size="12" fill="#888" font-weight="bold">MAIN PATH</text>
  <text x="20" y="400" font-size="12" fill="#888" font-weight="bold">BASELINE</text>

  <!-- 1 Pretrained -->
  <rect x="40" y="90" width="170" height="90" rx="6" fill="#e8f0fe" stroke="#1a56c4" stroke-width="2"/>
  <text x="125" y="112" text-anchor="middle" font-weight="bold">1  Pretrained model</text>
  <text x="125" y="132" text-anchor="middle" font-size="11">trained on next-move prediction</text>
  <text x="125" y="148" text-anchor="middle" font-size="11">never told the rules</text>
  <text x="125" y="168" text-anchor="middle" font-size="10" fill="#1a56c4">toy: GRU after pretrain()</text>

  <!-- 2 New task (middle, feeds both rows) -->
  <rect x="270" y="235" width="170" height="90" rx="6" fill="#fff4e0" stroke="#c47a00" stroke-width="2"/>
  <text x="355" y="257" text-anchor="middle" font-weight="bold">2  New task</text>
  <text x="355" y="277" text-anchor="middle" font-size="11">"where is the walker now?"</text>
  <text x="355" y="293" text-anchor="middle" font-size="11">only 16 labelled examples</text>
  <text x="355" y="313" text-anchor="middle" font-size="10" fill="#c47a00">toy: walk(bump_walls=True) x16</text>

  <!-- 3 Adapt (top) -->
  <rect x="500" y="90" width="170" height="90" rx="6" fill="#e8f0fe" stroke="#1a56c4" stroke-width="2"/>
  <text x="585" y="112" text-anchor="middle" font-weight="bold">3  Adapt</text>
  <text x="585" y="132" text-anchor="middle" font-size="11">fine-tune whole model, gently</text>
  <text x="585" y="148" text-anchor="middle" font-size="11">add a new output head</text>
  <text x="585" y="168" text-anchor="middle" font-size="10" fill="#1a56c4">toy: adapt(pretrained, ...)</text>

  <!-- 4 Test set (middle) -->
  <rect x="730" y="235" width="170" height="90" rx="6" fill="#fff4e0" stroke="#c47a00" stroke-width="2"/>
  <text x="815" y="257" text-anchor="middle" font-weight="bold">4  Fresh test set</text>
  <text x="815" y="277" text-anchor="middle" font-size="11">300 unseen sequences</text>
  <text x="815" y="293" text-anchor="middle" font-size="11">same rules, hit the walls</text>
  <text x="815" y="313" text-anchor="middle" font-size="10" fill="#c47a00">toy: 300 test walks</text>

  <!-- 5 Acc A -->
  <rect x="960" y="90" width="120" height="70" rx="6" fill="#e8f0fe" stroke="#1a56c4" stroke-width="2"/>
  <text x="1020" y="115" text-anchor="middle" font-weight="bold">5  Accuracy A</text>
  <text x="1020" y="140" text-anchor="middle" font-size="12">0.64</text>

  <!-- 6 Untrained -->
  <rect x="40" y="380" width="170" height="90" rx="6" fill="#f3f3f3" stroke="#777" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="125" y="402" text-anchor="middle" font-weight="bold">6  Untrained model</text>
  <text x="125" y="422" text-anchor="middle" font-size="11">same architecture</text>
  <text x="125" y="438" text-anchor="middle" font-size="11">random weights</text>
  <text x="125" y="458" text-anchor="middle" font-size="10" fill="#777">toy: TinyModel() fresh</text>

  <!-- 7 Adapt (bottom) -->
  <rect x="500" y="380" width="170" height="90" rx="6" fill="#f3f3f3" stroke="#777" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="585" y="402" text-anchor="middle" font-weight="bold">7  Adapt</text>
  <text x="585" y="422" text-anchor="middle" font-size="11">same 16 examples</text>
  <text x="585" y="438" text-anchor="middle" font-size="11">same number of steps</text>
  <text x="585" y="458" text-anchor="middle" font-size="10" fill="#777">toy: adapt(scratch, ...)</text>

  <!-- 8 Acc B -->
  <rect x="960" y="390" width="120" height="70" rx="6" fill="#f3f3f3" stroke="#777" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="1020" y="415" text-anchor="middle" font-weight="bold">8  Accuracy B</text>
  <text x="1020" y="440" text-anchor="middle" font-size="12">0.39</text>

  <!-- 9 Gap diamond -->
  <polygon points="1100,280 1170,280 1170,280 1135,230 1170,280 1135,330 1100,280" fill="none"/>
  <polygon points="1135,225 1178,280 1135,335 1092,280" fill="#e6f7ea" stroke="#1e7d3a" stroke-width="2"/>
  <text x="1135" y="272" text-anchor="middle" font-weight="bold" font-size="12">9  Gap</text>
  <text x="1135" y="288" text-anchor="middle" font-size="11">A minus B</text>
  <text x="1135" y="302" text-anchor="middle" font-size="11">+0.25</text>

  <!-- Arrows -->
  <!-- 1 -> 3 -->
  <line x1="210" y1="135" x2="498" y2="135" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="354" y="128" text-anchor="middle" font-size="11" fill="#333">model weights</text>
  <!-- 6 -> 7 -->
  <line x1="210" y1="425" x2="498" y2="425" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="354" y="418" text-anchor="middle" font-size="11" fill="#333">model weights</text>
  <!-- 2 -> 3 (up) -->
  <line x1="440" y1="260" x2="540" y2="182" stroke="#c47a00" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="470" y="210" text-anchor="middle" font-size="11" fill="#c47a00">16 labelled seqs</text>
  <!-- 2 -> 7 (down) -->
  <line x1="440" y1="300" x2="540" y2="378" stroke="#c47a00" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="470" y="352" text-anchor="middle" font-size="11" fill="#c47a00">16 labelled seqs</text>
  <!-- 3 -> 4 -->
  <line x1="670" y1="150" x2="770" y2="233" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="700" y="185" text-anchor="middle" font-size="11" fill="#333">predictions</text>
  <!-- 7 -> 4 -->
  <line x1="670" y1="410" x2="770" y2="327" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="700" y="378" text-anchor="middle" font-size="11" fill="#333">predictions</text>
  <!-- 4 -> 5 -->
  <line x1="880" y1="240" x2="965" y2="162" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="940" y="195" text-anchor="middle" font-size="11" fill="#333">vs true labels</text>
  <!-- 4 -> 8 -->
  <line x1="880" y1="320" x2="965" y2="392" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="940" y="365" text-anchor="middle" font-size="11" fill="#333">vs true labels</text>
  <!-- 5 -> 9 -->
  <line x1="1080" y1="140" x2="1128" y2="228" stroke="#1e7d3a" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- 8 -> 9 -->
  <line x1="1080" y1="415" x2="1128" y2="333" stroke="#1e7d3a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Verdict box -->
  <rect x="270" y="495" width="630" height="50" rx="6" fill="#f7f7f7" stroke="#bbb"/>
  <text x="585" y="515" text-anchor="middle" font-size="11" fill="#333"><tspan font-weight="bold">Reading the gap.</tspan>  Big and positive: pretraining carried the world model into the new task.  Near zero: it carried nothing useful.</text>
  <text x="585" y="533" text-anchor="middle" font-size="11" fill="#333">Extra check: if the adapted model matches the no-walls shortcut (0.53) on wall cases, it learned counting, not the world.</text>
</svg>
