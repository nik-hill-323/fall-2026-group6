name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # CPU-only deps for the test suite. The full requirements.txt targets the
      # CUDA 13 instance and pulls Julia for PySR, which CI does not need.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scikit-learn pytest mambapy==1.2.0
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run tests
        run: python -m pytest src/tests -q
